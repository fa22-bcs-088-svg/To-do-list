version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todos_db
    ports:
      - "3306:3306"
    volumes:
      - ./backup:/backup
      

  web:
    build: .
    container_name: flask_app
    ports:
      - "5020:5010"
    depends_on:
      - db
